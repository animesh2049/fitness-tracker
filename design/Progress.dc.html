<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
  <style>
    body { margin: 0; background: #0e0f11; color: #ecedee; font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #c8f03c; } a:hover { color: #dcff5a; }
    button { font-family: inherit; cursor: pointer; }
    .mono { font-family: 'IBM Plex Mono', 'SF Mono', Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .scroll { scrollbar-width: none; } .scroll::-webkit-scrollbar { display: none; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #0e0f11; color: #ecedee; display: flex; flex-direction: column; overflow: hidden; position: relative; box-sizing: border-box;">

  <div style="padding: 28px 20px 12px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0;">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #8b9096; text-transform: uppercase;">Progress</div>
    <div style="font-size: 30px; font-weight: 600; line-height: 1.1;">{{exName}}</div>
    <div style="font-size: 14px; color: #8b9096;">{{exSub}}</div>
  </div>

  <div class="scroll" style="flex-grow: 1; overflow-y: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; gap: 8px;">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
        <button onClick="{{c.pick}}" style="{{c.style}}">{{c.name}}</button>
      </sc-for>
    </div>

    <div style="background: #17191c; border: 1px solid #24272c; border-radius: 12px; padding: 14px 12px 10px; display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px;">
        <div style="font-size: 13px; font-weight: 600;">{{chartTitle}}</div>
        <div class="mono" style="font-size: 12px; color: #8b9096;">{{chartRange}}</div>
      </div>
      <svg width="334" height="200" viewBox="0 0 334 200" style="display: block; overflow: visible;">
        <sc-for list="{{grid}}" as="g" hint-placeholder-count="3">
          <line x1="40" x2="326" y1="{{g.y}}" y2="{{g.y}}" stroke="#24272c" stroke-width="1"></line>
          <text x="34" y="{{g.ty}}" text-anchor="end" font-size="11" fill="#8b9096" font-family="IBM Plex Mono, Menlo, monospace">{{g.label}}</text>
        </sc-for>
        <polyline points="{{linePoints}}" fill="none" stroke="#c8f03c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>
        <sc-for list="{{points}}" as="p" hint-placeholder-count="7">
          <circle cx="{{p.x}}" cy="{{p.y}}" r="{{p.r}}" fill="#c8f03c" stroke="#17191c" stroke-width="2"></circle>
          <circle cx="{{p.x}}" cy="{{p.y}}" r="16" fill="transparent" onClick="{{p.pick}}" style="cursor: pointer;"></circle>
          <text x="{{p.x}}" y="188" text-anchor="middle" font-size="10" fill="{{p.labelColor}}" font-family="IBM Plex Sans, Arial, sans-serif">{{p.date}}</text>
        </sc-for>
        <sc-if value="{{hasSel}}" hint-placeholder-val="{{ true }}">
          <rect x="{{sel.bx}}" y="{{sel.by}}" width="{{sel.bw}}" height="22" rx="6" fill="#ecedee"></rect>
          <text x="{{sel.x}}" y="{{sel.ty}}" text-anchor="middle" font-size="12" font-weight="600" fill="#101400" font-family="IBM Plex Mono, Menlo, monospace">{{sel.label}}</text>
        </sc-if>
      </svg>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
        <div style="background: #17191c; border: 1px solid #24272c; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 4px;">
          <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #8b9096;">{{s.label}}</div>
          <div class="mono" style="font-size: 20px; font-weight: 600;">{{s.value}}</div>
          <div style="font-size: 11px; color: #6b7076;">{{s.sub}}</div>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #8b9096; text-transform: uppercase; padding: 0 4px;">Personal records</div>
      <sc-for list="{{prs}}" as="pr" hint-placeholder-count="3">
        <div style="background: #17191c; border: 1px solid #24272c; border-radius: 12px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 52px; box-sizing: border-box;">
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <div style="font-size: 14px; font-weight: 500;">{{pr.label}}</div>
            <div style="font-size: 12px; color: #8b9096;">{{pr.date}}</div>
          </div>
          <div class="mono" style="font-size: 17px; font-weight: 600;">{{pr.value}}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="height: 72px; border-top: 1px solid #1f2226; background: #0e0f11; display: flex; align-items: stretch; flex-shrink: 0;">
    <div style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #6b7076;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"></path></svg>
      <span style="font-size: 11px; font-weight: 500;">Today</span>
    </div>
    <div style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #6b7076;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      <span style="font-size: 11px; font-weight: 500;">History</span>
    </div>
    <div style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #c8f03c;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path></svg>
      <span style="font-size: 11px; font-weight: 600;">Progress</span>
    </div>
    <div style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #6b7076;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>
      <span style="font-size: 11px; font-weight: 500;">Plan</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const PUSH_DATES = ['16 Aug', '20 Aug', '24 Aug', '28 Aug', '1 Sep', '5 Sep', '10 Sep'];
const LEGS_DATES = ['18 Aug', '22 Aug', '26 Aug', '30 Aug', '3 Sep', '8 Sep', '12 Sep'];
const EX = [
  { id: 'bench', name: 'Bench press', sub: 'Top set weight · last 7 sessions', unit: 'kg', min: 50, max: 65, dates: PUSH_DATES, values: [52.5, 55, 55, 57.5, 57.5, 60, 60],
    stats: [{ label: 'Top set', value: '60 × 8', sub: 'kg × reps' }, { label: 'Est. 1RM', value: '76 kg', sub: 'Epley, 5 Sep' }, { label: 'Volume', value: '1.4 t', sub: 'last session' }],
    prs: [{ label: 'Heaviest for 8 reps', value: '60 kg', date: '5 Sep 2026' }, { label: 'Most reps at 57.5 kg', value: '9', date: '1 Sep 2026' }, { label: 'Best estimated 1RM', value: '76 kg', date: '5 Sep 2026' }] },
  { id: 'squat', name: 'Back squat', sub: 'Top set weight · last 7 sessions', unit: 'kg', min: 65, max: 85, dates: LEGS_DATES, values: [70, 72.5, 75, 75, 77.5, 80, 80],
    stats: [{ label: 'Top set', value: '80 × 5', sub: 'kg × reps' }, { label: 'Est. 1RM', value: '93 kg', sub: 'Epley, 8 Sep' }, { label: 'Volume', value: '1.2 t', sub: 'last session' }],
    prs: [{ label: 'Heaviest for 5 reps', value: '80 kg', date: '8 Sep 2026' }, { label: 'Most reps at 75 kg', value: '6', date: '30 Aug 2026' }, { label: 'Best estimated 1RM', value: '93 kg', date: '8 Sep 2026' }] },
  { id: 'plank', name: 'Plank', sub: 'Longest hold · last 7 sessions', unit: 's', min: 25, max: 50, dates: PUSH_DATES, values: [30, 35, 35, 40, 45, 45, 45],
    stats: [{ label: 'Best hold', value: '45 s', sub: '3 sessions' }, { label: 'Total', value: '135 s', sub: 'last session' }, { label: 'Trend', value: '+15 s', sub: 'over 4 weeks' }],
    prs: [{ label: 'Longest hold', value: '45 s', date: '1 Sep 2026' }, { label: 'Most total in a session', value: '135 s', date: '10 Sep 2026' }, { label: 'First 30 s hold', value: '30 s', date: '16 Aug 2026' }] }
];
const PLOT = { left: 40, right: 326, top: 24, bottom: 164 };

class Component extends DCLogic {
  state = { ex: 'bench', sel: 6 };

  renderVals() {
    const st = this.state;
    const ex = EX.find((e) => e.id === st.ex);
    const n = ex.values.length;
    const xAt = (i) => PLOT.left + (i * (PLOT.right - PLOT.left)) / (n - 1);
    const yAt = (v) => PLOT.bottom - ((v - ex.min) / (ex.max - ex.min)) * (PLOT.bottom - PLOT.top);

    const chips = EX.map((e) => ({
      name: e.name,
      style: 'height: 40px; padding: 0 14px; border-radius: 20px; font-size: 13px; font-weight: 600; ' + (e.id === st.ex ? 'background: #ecedee; color: #101400; border: 0;' : 'background: transparent; color: #b4b8bd; border: 1px solid #2c3036;'),
      pick: () => this.setState({ ex: e.id, sel: e.values.length - 1 })
    }));

    const mid = (ex.min + ex.max) / 2;
    const grid = [ex.min, mid, ex.max].map((v) => ({ y: Math.round(yAt(v)), ty: Math.round(yAt(v)) + 4, label: v + ' ' + ex.unit }));

    const points = ex.values.map((v, i) => ({
      x: Math.round(xAt(i)), y: Math.round(yAt(v)),
      r: i === st.sel ? 6 : 4,
      date: ex.dates[i],
      labelColor: i === st.sel ? '#ecedee' : '#6b7076',
      pick: () => this.setState({ sel: i })
    }));
    const linePoints = points.map((p) => p.x + ',' + p.y).join(' ');

    const sp = points[st.sel];
    const label = ex.values[st.sel] + ' ' + ex.unit;
    const bw = label.length * 8 + 12;
    const bx = sp ? Math.min(Math.max(sp.x - bw / 2, PLOT.left), PLOT.right - bw) : 0;
    const sel = sp ? { x: bx + bw / 2, ty: sp.y - 17, bx, by: sp.y - 32, bw, label } : null;

    return {
      exName: ex.name, exSub: ex.sub, chips,
      chartTitle: ex.unit === 's' ? 'Longest hold' : 'Top set weight',
      chartRange: ex.dates[0] + ' to ' + ex.dates[n - 1],
      grid, points, linePoints,
      hasSel: !!sel, sel: sel || { x: 0, ty: 0, bx: 0, by: 0, bw: 0, label: '' },
      stats: ex.stats, prs: ex.prs
    };
  }
}
</script>
</body>
</html>
