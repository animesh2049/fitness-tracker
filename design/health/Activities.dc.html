<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
  <style>
    body { margin: 0; background: #0e0f11; color: #ecedee; font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #c8f03c; } a:hover { color: #dcff5a; }
    button { font-family: inherit; cursor: pointer; }
    .mono { font-family: 'IBM Plex Mono', 'SF Mono', Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .scroll { scrollbar-width: none; } .scroll::-webkit-scrollbar { display: none; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #0e0f11; color: #ecedee; display: flex; flex-direction: column; overflow: hidden; position: relative; box-sizing: border-box;">

  <div style="padding: 28px 12px 8px 12px; display: flex; align-items: flex-start; gap: 8px; flex-shrink: 0;">
    <button aria-label="Back" style="width: 44px; height: 44px; border-radius: 10px; background: transparent; border: 0; color: #ecedee; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    </button>
    <div style="display: flex; flex-direction: column; gap: 4px; padding-top: 6px;">
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #8b9096; text-transform: uppercase;">Health · From the watch</div>
      <div style="font-size: 30px; font-weight: 600; line-height: 1.1;">Activities</div>
      <div style="font-size: 14px; color: #8b9096;">{{summary}}</div>
    </div>
  </div>

  <div class="scroll" style="display: flex; gap: 8px; overflow-x: auto; padding: 8px 16px 12px; flex-shrink: 0;">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
      <button onClick="{{c.pick}}" style="{{c.style}}">{{c.name}}</button>
    </sc-for>
  </div>

  <div class="scroll" style="flex-grow: 1; overflow-y: auto; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 8px;">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 8px 4px 2px;">
        <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #8b9096; text-transform: uppercase;">{{g.month}}</div>
        <div class="mono" style="font-size: 12px; color: #6b7076;">{{g.total}}</div>
      </div>
      <sc-for list="{{g.items}}" as="a" hint-placeholder-count="4">
        <div style="background: #17191c; border: 1px solid #24272c; border-radius: 12px; padding: 12px 12px 12px 14px; display: flex; align-items: center; gap: 12px; min-height: 68px; box-sizing: border-box;">
          <div style="width: 40px; height: 40px; border-radius: 10px; background: #1f2226; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c8f03c" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="{{a.icon}}"></path></svg>
          </div>
          <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <div style="font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{a.name}}</div>
              <sc-if value="{{a.linked}}" hint-placeholder-val="{{ false }}">
                <div style="height: 18px; padding: 0 7px; border-radius: 9px; border: 1px solid #33421a; color: #c8f03c; font-size: 10px; font-weight: 600; display: flex; align-items: center; flex-shrink: 0;">Linked</div>
              </sc-if>
            </div>
            <div style="font-size: 12px; color: #8b9096;">{{a.meta}}</div>
          </div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0;">
            <div class="mono" style="font-size: 15px; font-weight: 600;">{{a.duration}}</div>
            <div style="font-size: 11px; color: #6b7076;">{{a.sub}}</div>
          </div>
        </div>
      </sc-for>
    </sc-for>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const ICONS = {
  strength: 'M6 5v14M18 5v14M3 8v8M21 8v8M6 12h12',
  walk: 'M13 4a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM9.5 22l2-7 2.5 2.5V22M7 13l2-5 3-1 3 3 3 1M8 22l1.5-5',
  run: 'M14 4a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM4 17l5-1 2-5 3 2 4 1M9 16l-2 6M13 12l-1 4 3 2 1 4',
  other: 'M12 3v18M3 12h18'
};
const ALL = [
  { m: 'September 2026', sport: 'strength', name: 'Upper A', meta: 'Wed 16 Sep · 07:05 · avg 118 bpm', duration: '58 min', sub: '386 kcal', linked: true, min: 58 },
  { m: 'September 2026', sport: 'walk', name: 'Walk', meta: 'Mon 14 Sep · 18:02 · 6.1 km · 9:42 /km', duration: '1 h 04 m', sub: '312 kcal', linked: false, min: 64 },
  { m: 'September 2026', sport: 'strength', name: 'Lower A', meta: 'Sun 13 Sep · 07:20 · avg 124 bpm', duration: '1 h 02 m', sub: '410 kcal', linked: true, min: 62 },
  { m: 'September 2026', sport: 'strength', name: 'Upper B', meta: 'Fri 11 Sep · 07:10 · avg 116 bpm', duration: '55 min', sub: '362 kcal', linked: true, min: 55 },
  { m: 'September 2026', sport: 'walk', name: 'Walk', meta: 'Thu 10 Sep · 19:15 · 4.4 km · 10:05 /km', duration: '44 min', sub: '221 kcal', linked: false, min: 44 },
  { m: 'September 2026', sport: 'strength', name: 'Lower B', meta: 'Wed 9 Sep · 07:12 · avg 127 bpm', duration: '1 h 05 m', sub: '428 kcal', linked: true, min: 65 },
  { m: 'September 2026', sport: 'run', name: 'Run', meta: 'Sun 6 Sep · 06:40 · 5.0 km · 6:31 /km', duration: '32 min', sub: '338 kcal', linked: false, min: 32 },
  { m: 'September 2026', sport: 'strength', name: 'Upper A', meta: 'Fri 4 Sep · 07:05 · avg 119 bpm', duration: '57 min', sub: '380 kcal', linked: true, min: 57 },
  { m: 'August 2026', sport: 'strength', name: 'Lower A', meta: 'Sun 30 Aug · 07:30 · avg 122 bpm', duration: '1 h 00 m', sub: '396 kcal', linked: true, min: 60 },
  { m: 'August 2026', sport: 'other', name: 'Yoga', meta: 'Sat 29 Aug · 08:00 · avg 78 bpm', duration: '30 min', sub: '96 kcal', linked: false, min: 30 },
  { m: 'August 2026', sport: 'walk', name: 'Walk', meta: 'Fri 28 Aug · 18:20 · 5.2 km · 9:58 /km', duration: '52 min', sub: '260 kcal', linked: false, min: 52 }
];
const FILTERS = [['all', 'All'], ['strength', 'Strength'], ['walk', 'Walks'], ['run', 'Runs'], ['other', 'Other']];

function hours(min) { const h = Math.floor(min / 60), r = min % 60; return h + ' h ' + (r < 10 ? '0' + r : r) + ' m'; }

class Component extends DCLogic {
  state = { f: 'all' };
  renderVals() {
    const st = this.state;
    const items = ALL.filter((a) => st.f === 'all' || a.sport === st.f);
    const groups = [];
    items.forEach((a) => {
      let g = groups.find((x) => x.month === a.m);
      if (!g) { g = { month: a.m, items: [], mins: 0 }; groups.push(g); }
      g.items.push({ icon: ICONS[a.sport], name: a.name, meta: a.meta, duration: a.duration, sub: a.sub, linked: a.linked });
      g.mins += a.min;
    });
    groups.forEach((g) => { g.total = g.items.length + ' · ' + hours(g.mins); });
    const sep = items.filter((a) => a.m === 'September 2026');
    return {
      summary: sep.length + ' this month · ' + hours(sep.reduce((s, a) => s + a.min, 0)),
      chips: FILTERS.map((f) => ({ name: f[1], style: 'height: 40px; padding: 0 14px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; flex-shrink: 0; ' + (f[0] === st.f ? 'background: #ecedee; color: #101400; border: 0;' : 'background: transparent; color: #b4b8bd; border: 1px solid #2c3036;'), pick: () => this.setState({ f: f[0] }) })),
      groups
    };
  }
}
</script>
</body>
</html>
