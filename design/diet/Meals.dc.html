<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
  <style>
    body { margin: 0; background: #0e0f11; color: #ecedee; font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #c8f03c; } a:hover { color: #dcff5a; }
    button { font-family: inherit; cursor: pointer; }
    .mono { font-family: 'IBM Plex Mono', 'SF Mono', Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .scroll { scrollbar-width: none; } .scroll::-webkit-scrollbar { display: none; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #0e0f11; color: #ecedee; display: flex; flex-direction: column; overflow: hidden; position: relative; box-sizing: border-box;">

  <div style="padding: 28px 20px 12px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0;">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #8b9096; text-transform: uppercase;">Diet · Meals</div>
    <div style="font-size: 30px; font-weight: 600; line-height: 1.1;">Meals</div>
    <div style="font-size: 14px; color: #8b9096;">{{meta}}</div>
  </div>

  <div style="padding: 0 16px 8px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;">
    <div style="height: 44px; background: #17191c; border: 1px solid #24272c; border-radius: 10px; padding: 0 12px; display: flex; align-items: center; gap: 8px; color: #6b7076;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <span style="font-size: 15px;">Search meals</span>
    </div>
    <div style="display: flex; gap: 8px;">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <button onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>
  </div>

  <div class="scroll" style="flex-grow: 1; overflow-y: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 10px;">
    <sc-for list="{{meals}}" as="m" hint-placeholder-count="6">
      <div style="background: #17191c; border: 1px solid #24272c; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;">
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <div style="font-size: 16px; font-weight: 500;">{{m.name}}</div>
            <div class="mono" style="font-size: 13px; color: #8b9096;">{{m.macros}}</div>
          </div>
          <div style="display: flex; gap: 6px; flex-shrink: 0; align-items: center;">
            <sc-if value="{{m.prep}}" hint-placeholder-val="{{ false }}">
              <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #f5b400; border: 1px solid #4a3d0c; border-radius: 6px; padding: 4px 7px;">Prep</div>
            </sc-if>
            <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #8b9096; border: 1px solid #2c3036; border-radius: 6px; padding: 4px 7px;">{{m.slot}}</div>
          </div>
        </div>
        <sc-if value="{{m.confirming}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; align-items: center; gap: 8px; background: #1f1010; border: 1px solid #4a1c18; border-radius: 10px; padding: 8px 10px;">
            <div style="font-size: 13px; color: #ffb3aa; flex-grow: 1;">{{m.deleteText}}</div>
            <button onClick="{{m.confirmDelete}}" style="height: 40px; padding: 0 12px; border-radius: 8px; background: #ff6b5c; color: #1a0705; border: 0; font-size: 13px; font-weight: 600;">Delete</button>
            <button onClick="{{m.cancelDelete}}" style="height: 40px; padding: 0 12px; border-radius: 8px; background: transparent; color: #ecedee; border: 1px solid #3a3f46; font-size: 13px;">Keep</button>
          </div>
        </sc-if>
        <sc-if value="{{m.idle}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; gap: 8px;">
            <button style="height: 40px; padding: 0 14px; border-radius: 8px; background: transparent; color: #ecedee; border: 1px solid #2c3036; font-size: 13px; font-weight: 500;">Open</button>
            <button style="height: 40px; padding: 0 14px; border-radius: 8px; background: transparent; color: #ecedee; border: 1px solid #2c3036; font-size: 13px; font-weight: 500;">Edit</button>
            <button onClick="{{m.askDelete}}" style="height: 40px; padding: 0 14px; border-radius: 8px; background: transparent; color: #6b7076; border: 0; font-size: 13px; font-weight: 500; margin-left: auto;">Delete</button>
          </div>
        </sc-if>
      </div>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <div style="padding: 32px 16px; text-align: center; color: #8b9096; font-size: 14px; line-height: 1.4;">No meals here. Add one, or restore the ones you deleted from a backup.</div>
    </sc-if>
  </div>

  <div style="padding: 12px 16px; flex-shrink: 0; border-top: 1px solid #1f2226;">
    <button style="width: 100%; height: 52px; border-radius: 12px; background: #c8f03c; color: #101400; border: 0; font-size: 16px; font-weight: 600;">+ Add meal</button>
  </div>

  <div style="height: 72px; border-top: 1px solid #1f2226; background: #0e0f11; display: flex; align-items: stretch; flex-shrink: 0;">
    <div style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #6b7076;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"></path></svg>
      <span style="font-size: 11px; font-weight: 500;">Today</span>
    </div>
    <div style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #c8f03c;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16a8 8 0 0 1-16 0z"></path><path d="M9 3v4M12 2v5M15 3v4"></path></svg>
      <span style="font-size: 11px; font-weight: 600;">Diet</span>
    </div>
    <div style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #6b7076;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      <span style="font-size: 11px; font-weight: 500;">History</span>
    </div>
    <div style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #6b7076;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path></svg>
      <span style="font-size: 11px; font-weight: 500;">Progress</span>
    </div>
    <div style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #6b7076;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>
      <span style="font-size: 11px; font-weight: 500;">Plan</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const ALL = [
  { id: 1, name: 'Moong dal chilla with curd', slot: 'Breakfast', macros: '450 kcal · 35 g protein', prep: true, uses: 3 },
  { id: 2, name: 'Oats with whey and peanut butter', slot: 'Breakfast', macros: '430 kcal · 36 g protein', prep: false, uses: 4 },
  { id: 3, name: 'Dal, sabzi, roti and curd', slot: 'Lunch', macros: '600 kcal · 26 g protein', prep: false, uses: 4 },
  { id: 4, name: 'Rajma chawal', slot: 'Lunch', macros: '560 kcal · 20 g protein', prep: true, uses: 2 },
  { id: 5, name: 'Chole with brown rice', slot: 'Lunch', macros: '580 kcal · 22 g protein', prep: true, uses: 1 },
  { id: 6, name: 'Paneer bhurji with roti', slot: 'Dinner', macros: '550 kcal · 33 g protein', prep: false, uses: 4 },
  { id: 7, name: 'Soya chunk curry with roti', slot: 'Dinner', macros: '520 kcal · 38 g protein', prep: false, uses: 3 }
];
const FILTERS = ['All', 'Breakfast', 'Lunch', 'Dinner'];
class Component extends DCLogic {
  state = { filter: 'All', confirming: -1, deleted: [] };
  renderVals() {
    const s = this.state;
    const chip = 'flex: 1 1 0; height: 40px; border-radius: 8px; font-size: 13px; font-weight: 600; ';
    const visible = ALL.filter((m) => s.deleted.indexOf(m.id) < 0).filter((m) => s.filter === 'All' || m.slot === s.filter);
    return {
      meta: (ALL.length - s.deleted.length) + ' meals · ' + ALL.filter((m) => m.prep && s.deleted.indexOf(m.id) < 0).length + ' need prep the day before',
      filters: FILTERS.map((label) => ({
        label,
        style: chip + (s.filter === label ? 'background: #c8f03c; color: #101400; border: 0;' : 'background: #17191c; color: #ecedee; border: 1px solid #24272c;'),
        pick: () => this.setState({ filter: label })
      })),
      meals: visible.map((m) => Object.assign({}, m, {
        confirming: s.confirming === m.id, idle: s.confirming !== m.id,
        deleteText: m.uses > 0 ? 'Used in ' + m.uses + ' slot' + (m.uses > 1 ? 's' : '') + ' of the week plan. Those slots become empty.' : 'Delete this meal?',
        askDelete: () => this.setState({ confirming: m.id }),
        cancelDelete: () => this.setState({ confirming: -1 }),
        confirmDelete: () => this.setState({ confirming: -1, deleted: s.deleted.concat([m.id]) })
      })),
      empty: visible.length === 0
    };
  }
}
</script>
</body>
</html>
