<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
  <style>
    body { margin: 0; background: #0e0f11; color: #ecedee; font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #c8f03c; } a:hover { color: #dcff5a; }
    button { font-family: inherit; cursor: pointer; }
    .mono { font-family: 'IBM Plex Mono', 'SF Mono', Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #0e0f11; color: #ecedee; display: flex; flex-direction: column; overflow: hidden; position: relative; box-sizing: border-box;">

  <div style="padding: 24px 20px 12px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #8b9096; text-transform: uppercase;">Push day · Exercise 5 of 5</div>
      <button style="height: 36px; padding: 0 12px; border-radius: 8px; background: transparent; color: #8b9096; border: 1px solid #2c3036; font-size: 13px; font-weight: 500;">End</button>
    </div>
    <div style="display: flex; gap: 4px;">
      <div style="flex: 1 1 0; height: 4px; border-radius: 2px; background: #c8f03c;"></div>
      <div style="flex: 1 1 0; height: 4px; border-radius: 2px; background: #c8f03c;"></div>
      <div style="flex: 1 1 0; height: 4px; border-radius: 2px; background: #c8f03c;"></div>
      <div style="flex: 1 1 0; height: 4px; border-radius: 2px; background: #c8f03c;"></div>
      <div style="flex: 1 1 0; height: 4px; border-radius: 2px; background: #6f8a1c;"></div>
    </div>
    <div style="font-size: 28px; font-weight: 600; line-height: 1.1;">Plank</div>
    <div style="font-size: 14px; color: #8b9096;">Last time <span class="mono" style="color: #b4b8bd;">45 · 45 · 45 s</span></div>
  </div>

  <div style="padding: 0 16px; display: flex; gap: 8px; flex-shrink: 0;">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
      <div style="{{c.style}}">
        <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;">Set {{c.num}}</div>
        <div class="mono" style="font-size: 18px; font-weight: 600;">{{c.text}}</div>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; padding: 0 20px;">
    <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: {{labelColor}};">{{label}}</div>
    <div class="mono" style="font-size: 120px; font-weight: 600; line-height: 1; letter-spacing: -0.03em; color: {{numColor}};">{{big}}</div>
    <div style="font-size: 15px; color: #8b9096;">{{sub}}</div>
    <div style="width: 100%; height: 6px; background: #1f2226; border-radius: 3px; overflow: hidden;">
      <div style="height: 100%; background: {{barColor}}; border-radius: 3px; width: {{pct}}%;"></div>
    </div>
  </div>

  <div style="padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0;">
    <sc-if value="{{isIdle}}" hint-placeholder-val="{{ true }}">
      <button onClick="{{start}}" style="height: 60px; border-radius: 12px; background: #c8f03c; color: #101400; border: 0; font-size: 18px; font-weight: 600;">Start set {{setNum}}</button>
    </sc-if>
    <sc-if value="{{isCountdown}}" hint-placeholder-val="{{ false }}">
      <button onClick="{{cancel}}" style="height: 60px; border-radius: 12px; background: #17191c; color: #ecedee; border: 1px solid #24272c; font-size: 18px; font-weight: 500;">Cancel</button>
    </sc-if>
    <sc-if value="{{isWork}}" hint-placeholder-val="{{ false }}">
      <button onClick="{{stop}}" style="height: 60px; border-radius: 12px; background: #17191c; color: #ff6b5c; border: 1px solid #3a2a28; font-size: 18px; font-weight: 600;">Stop early</button>
    </sc-if>
    <sc-if value="{{isRest}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; gap: 10px;">
        <button onClick="{{addRest}}" style="flex: 1 1 0; height: 56px; border-radius: 12px; background: #17191c; color: #ecedee; border: 1px solid #24272c; font-size: 16px; font-weight: 500;">+30 s</button>
        <button onClick="{{skipRest}}" style="flex: 1 1 0; height: 56px; border-radius: 12px; background: #c8f03c; color: #101400; border: 0; font-size: 16px; font-weight: 600;">Skip rest</button>
      </div>
    </sc-if>
    <sc-if value="{{isComplete}}" hint-placeholder-val="{{ false }}">
      <button onClick="{{reset}}" style="height: 60px; border-radius: 12px; background: #c8f03c; color: #101400; border: 0; font-size: 18px; font-weight: 600;">Finish session</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const TARGET = 55, COUNTDOWN = 5, REST = 60, SETS = 3;

class Component extends DCLogic {
  state = { set: 1, phase: 'idle', t: 0, total: 1, logged: [] };

  componentWillUnmount() { this.clearTimer(); }
  clearTimer() { if (this.timer) { clearInterval(this.timer); this.timer = null; } }

  run(phase, secs, onEnd) {
    this.clearTimer();
    this.setState({ phase, t: secs, total: secs });
    this.timer = setInterval(() => {
      const t = this.state.t - 1;
      if (t <= 0) { this.clearTimer(); onEnd(); }
      else this.setState({ t });
    }, 1000);
  }

  start() { this.run('countdown', COUNTDOWN, () => this.startWork()); }
  startWork() { this.run('work', TARGET, () => this.finishSet(TARGET)); }
  finishSet(secs) {
    const logged = this.state.logged.concat([secs]);
    if (logged.length >= SETS) { this.clearTimer(); this.setState({ logged, phase: 'complete', t: 0 }); return; }
    this.setState({ logged });
    this.run('rest', REST, () => this.nextSet());
  }
  nextSet() { this.clearTimer(); this.setState({ phase: 'idle', set: this.state.logged.length + 1, t: 0 }); }

  renderVals() {
    const s = this.state;
    const chips = [1, 2, 3].map((n) => {
      const done = s.logged[n - 1];
      const active = n === s.set && s.phase !== 'complete';
      const base = 'flex: 1 1 0; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; box-sizing: border-box; ';
      let style, text;
      if (done != null) { style = base + 'background: #17191c; border: 1px solid #33421a; color: #c8f03c;'; text = done + ' s'; }
      else if (active) { style = base + 'background: #17191c; border: 1px solid #c8f03c; color: #ecedee;'; text = TARGET + ' s'; }
      else { style = base + 'background: transparent; border: 1px solid #1f2226; color: #6b7076;'; text = TARGET + ' s'; }
      return { num: n, text, style };
    });

    let label = '', big = '', sub = '', pct = 0, labelColor = '#8b9096', numColor = '#ecedee', barColor = '#c8f03c';
    if (s.phase === 'idle') { label = 'Ready'; big = String(TARGET); sub = 'seconds · target for set ' + s.set; pct = 0; }
    else if (s.phase === 'countdown') { label = 'Get ready'; big = String(s.t); sub = 'get into position'; pct = 0; labelColor = '#f5b400'; numColor = '#f5b400'; }
    else if (s.phase === 'work') { label = 'Hold'; big = String(s.t); sub = 'seconds left of ' + TARGET; pct = Math.round(((TARGET - s.t) / TARGET) * 100); labelColor = '#c8f03c'; }
    else if (s.phase === 'rest') { label = 'Rest'; big = String(s.t); sub = 'next: set ' + (s.logged.length + 1) + ' · ' + TARGET + ' s'; pct = Math.round((s.t / s.total) * 100); barColor = '#3a3f46'; }
    else { label = 'Exercise complete'; big = String(s.logged.reduce((a, b) => a + b, 0)); sub = 'seconds held in total'; pct = 100; labelColor = '#c8f03c'; }

    return {
      chips, label, big, sub, pct, labelColor, numColor, barColor,
      setNum: s.set,
      isIdle: s.phase === 'idle',
      isCountdown: s.phase === 'countdown',
      isWork: s.phase === 'work',
      isRest: s.phase === 'rest',
      isComplete: s.phase === 'complete',
      start: () => this.start(),
      cancel: () => { this.clearTimer(); this.setState({ phase: 'idle', t: 0 }); },
      stop: () => { const held = TARGET - s.t; this.clearTimer(); this.finishSet(held); },
      addRest: () => this.setState({ t: s.t + 30, total: s.total + 30 }),
      skipRest: () => this.nextSet(),
      reset: () => { this.clearTimer(); this.setState({ set: 1, phase: 'idle', t: 0, total: 1, logged: [] }); }
    };
  }
}
</script>
</body>
</html>
