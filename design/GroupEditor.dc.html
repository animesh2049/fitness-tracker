<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
  <style>
    body { margin: 0; background: #0e0f11; color: #ecedee; font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #c8f03c; } a:hover { color: #dcff5a; }
    button { font-family: inherit; cursor: pointer; }
    .mono { font-family: 'IBM Plex Mono', 'SF Mono', Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .scroll { scrollbar-width: none; } .scroll::-webkit-scrollbar { display: none; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #0e0f11; color: #ecedee; display: flex; flex-direction: column; overflow: hidden; position: relative; box-sizing: border-box;">

  <div style="padding: 28px 20px 12px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0;">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #8b9096; text-transform: uppercase;">Plan · Edit group</div>
    <div style="font-size: 30px; font-weight: 600; line-height: 1.1;">Push day</div>
    <div style="font-size: 14px; color: #8b9096;">{{meta}}</div>
  </div>

  <div class="scroll" style="flex-grow: 1; overflow-y: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 10px;">
    <sc-for list="{{exercises}}" as="ex" hint-placeholder-count="5">
      <div style="background: #17191c; border: 1px solid #24272c; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5c6168" stroke-width="2" stroke-linecap="round"><path d="M8 6h.01M8 12h.01M8 18h.01M16 6h.01M16 12h.01M16 18h.01"></path></svg>
            <div style="font-size: 16px; font-weight: 500;">{{ex.name}}</div>
          </div>
          <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #8b9096; border: 1px solid #2c3036; border-radius: 6px; padding: 4px 7px;">{{ex.typeLabel}}</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <sc-for list="{{ex.sets}}" as="s" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 8px; min-height: 44px;">
              <div class="mono" style="width: 20px; font-size: 13px; color: #6b7076;">{{s.num}}</div>
              <div class="mono" style="flex-grow: 1; font-size: 15px; color: {{s.textColor}};">{{s.text}}</div>
              <button onClick="{{s.toggleWarm}}" style="{{s.warmStyle}}">W</button>
              <button onClick="{{s.remove}}" style="width: 44px; height: 40px; border-radius: 8px; background: transparent; color: #6b7076; border: 0; font-size: 18px;">×</button>
            </div>
          </sc-for>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
          <button onClick="{{ex.addSet}}" style="height: 40px; padding: 0 14px; border-radius: 8px; background: transparent; color: #c8f03c; border: 1px solid #33421a; font-size: 13px; font-weight: 600;">+ Add set</button>
          <button onClick="{{ex.toggleSuperset}}" style="{{ex.ssStyle}}">{{ex.ssLabel}}</button>
        </div>
        <sc-if value="{{ex.supersetNext}}" hint-placeholder-val="{{ false }}">
          <div style="font-size: 12px; color: #f5b400; display: flex; align-items: center; gap: 6px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 17l10-10M7 7h10v10"></path></svg>
            Superset with {{ex.nextName}} · rest after both
          </div>
        </sc-if>
      </div>
    </sc-for>
    <button style="height: 52px; border-radius: 12px; background: transparent; color: #ecedee; border: 1px dashed #3a3f46; font-size: 15px; font-weight: 500;">+ Add exercise</button>
  </div>

  <div style="padding: 12px 16px; display: flex; gap: 10px; flex-shrink: 0; border-top: 1px solid #1f2226;">
    <button style="flex: 1 1 0; height: 52px; border-radius: 12px; background: #17191c; color: #ecedee; border: 1px solid #24272c; font-size: 15px; font-weight: 500;">Cancel</button>
    <button style="flex: 2 1 0; height: 52px; border-radius: 12px; background: #c8f03c; color: #101400; border: 0; font-size: 16px; font-weight: 600;">Save group</button>
  </div>

  <div style="height: 72px; border-top: 1px solid #1f2226; background: #0e0f11; display: flex; align-items: stretch; flex-shrink: 0;">
    <div style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #6b7076;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"></path></svg>
      <span style="font-size: 11px; font-weight: 500;">Today</span>
    </div>
    <div style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #6b7076;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      <span style="font-size: 11px; font-weight: 500;">History</span>
    </div>
    <div style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #6b7076;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path></svg>
      <span style="font-size: 11px; font-weight: 500;">Progress</span>
    </div>
    <div style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #c8f03c;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>
      <span style="font-size: 11px; font-weight: 600;">Plan</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const TYPE_LABEL = { weight: 'Weight', bodyweight: 'Body', timed: 'Timed' };
function initial() {
  return [
    { name: 'Bench press', type: 'weight', ss: false, sets: [{ reps: 8, w: 40, warm: true }, { reps: 8, w: 60, warm: false }, { reps: 8, w: 60, warm: false }, { reps: 8, w: 60, warm: false }] },
    { name: 'Overhead press', type: 'weight', ss: false, sets: [{ reps: 10, w: 30, warm: false }, { reps: 10, w: 30, warm: false }, { reps: 10, w: 30, warm: false }] },
    { name: 'Incline dumbbell press', type: 'weight', ss: true, sets: [{ reps: 10, w: 22.5, warm: false }, { reps: 10, w: 22.5, warm: false }, { reps: 10, w: 22.5, warm: false }] },
    { name: 'Triceps pushdown', type: 'weight', ss: false, sets: [{ reps: 12, w: 25, warm: false }, { reps: 12, w: 25, warm: false }, { reps: 12, w: 25, warm: false }] },
    { name: 'Plank', type: 'timed', ss: false, sets: [{ secs: 45, warm: false }, { secs: 45, warm: false }, { secs: 45, warm: false }] }
  ];
}

class Component extends DCLogic {
  state = { exercises: initial() };

  update(fn) {
    const exercises = this.state.exercises.map((e) => Object.assign({}, e, { sets: e.sets.slice() }));
    fn(exercises);
    this.setState({ exercises });
  }

  renderVals() {
    const list = this.state.exercises;
    const totalSets = list.reduce((a, e) => a + e.sets.filter((s) => !s.warm).length, 0);
    const exercises = list.map((ex, i) => {
      const sets = ex.sets.map((s, j) => {
        const text = ex.type === 'timed' ? s.secs + ' s' : s.reps + ' reps · ' + s.w + ' kg';
        const warmBase = 'width: 40px; height: 40px; border-radius: 8px; font-size: 12px; font-weight: 700; ';
        return {
          num: j + 1,
          text: text,
          textColor: s.warm ? '#8b9096' : '#ecedee',
          warmStyle: warmBase + (s.warm ? 'background: #f5b400; color: #1a1400; border: 0;' : 'background: transparent; color: #6b7076; border: 1px solid #2c3036;'),
          toggleWarm: () => this.update((xs) => { xs[i].sets[j] = Object.assign({}, xs[i].sets[j], { warm: !xs[i].sets[j].warm }); }),
          remove: () => this.update((xs) => { xs[i].sets.splice(j, 1); })
        };
      });
      const canSS = i < list.length - 1;
      return {
        name: ex.name,
        typeLabel: TYPE_LABEL[ex.type],
        sets,
        addSet: () => this.update((xs) => { const last = xs[i].sets[xs[i].sets.length - 1]; xs[i].sets.push(last ? Object.assign({}, last, { warm: false }) : (ex.type === 'timed' ? { secs: 30, warm: false } : { reps: 10, w: 20, warm: false })); }),
        supersetNext: ex.ss && canSS,
        nextName: canSS ? list[i + 1].name : '',
        ssLabel: ex.ss ? 'Unlink superset' : 'Superset with next',
        ssStyle: 'height: 40px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 500; ' + (canSS ? '' : 'visibility: hidden; ') + (ex.ss ? 'background: transparent; color: #f5b400; border: 1px solid #4a3d10;' : 'background: transparent; color: #8b9096; border: 1px solid #2c3036;'),
        toggleSuperset: () => this.update((xs) => { xs[i].ss = !xs[i].ss; })
      };
    });
    return { exercises, meta: list.length + ' exercises · ' + totalSets + ' working sets · about 50 min' };
  }
}
</script>
</body>
</html>
